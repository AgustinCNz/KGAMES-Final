<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Admin - KGames</title>
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="shortcut icon" href="/img/logo/k-games.png">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <!-- Barra de navegación -->
  <header>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <div class="logo">
        <img src="/img/logo/k-games.png" alt="Logo de K-GAMES" class="navbar-logo">
      </div>
      <button class="menu-toggle" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
      <ul class="navbar-menu">
        <li><a href="/html/index.html">Inicio</a></li>
        <li><a href="/html/index.html">Cerrar sesión</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenedor principal -->
  <main class="admin-container">
    <!-- Barra lateral -->
    <aside class="admin-sidebar">
      <h2>Panel del Admin</h2>
      <ul>
        <li><button onclick="showProducts()">Gestión de Productos</button></li>
      </ul>
    </aside>

    <!-- Sección dinámica -->
    <section class="admin-content">
      <button  id="agregar-producto" onclick="openModal()">Agregar Producto</button>

      <!-- Contenedor para productos -->
      <div id="admin-juegos" class="admin-section active">
        <!-- Los productos dinámicos aparecerán aquí -->
      </div>

      <!-- Modal para agregar/editar producto -->
<div id="task-modal" class="modal">
  <div class="modal-content">
    <h2 id="modal-title">Agregar Producto</h2>
    <input type="text" id="titulo" placeholder="Título" required />
    <input type="number" id="precio" placeholder="Precio" required />
    <input type="text" id="categoria" placeholder="Categoría" required />
    <input type="text" id="descripcion" placeholder="Descripción" required />
    <input type="text" id="imagen" placeholder="URL Imagen" required />
    <div class="modal-actions">
      <button onclick="saveProduct()">Guardar</button>
      <button onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

    </section>
  </main>

  <script src="/JavaScript/navbar.js"></script>
  <script src="/JavaScript/admin.js"></script>
</body>
</html>
